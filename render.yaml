services:
  - type: web
    name: piezo-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PIEZO_DATA_ROOT
        value: /opt/render/project/src/data
      - key: PIEZO_PROCESSED_ROOT
        value: /opt/render/project/src/data/runtime/processed
      - key: PIEZO_MANIFEST_ROOT
        value: /opt/render/project/src/data/manifests
      - key: PIEZO_R2_PUBLIC_BASE_URL
        sync: false
      - key: PIEZO_CORS_ORIGINS
        sync: false
